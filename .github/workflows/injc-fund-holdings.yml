name: INJ Node · INJC issuer holdings / managed assets

on:
  workflow_dispatch:
  schedule:
    # The issuer reports actual INJ positions periodically; spot USD is refreshed in the browser.
    - cron: '21 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/injc-fund-holdings.yml'
      - 'scripts/update-injc-fund-holdings.mjs'

permissions:
  contents: write

concurrency:
  group: injnode-injc-fund-holdings
  cancel-in-progress: false

jobs:
  issuer-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the latest INJC holdings directly from Canary Capital
        run: node scripts/update-injc-fund-holdings.mjs
      - name: Publish dated verified report to GitHub Pages
        shell: bash
        run: |
          set -eu
          file="market-data/injc-fund-holdings.json"
          history="market-data/injc-fund-holdings-history.json"
          if git diff --quiet -- "$file" "$history"; then
            echo "No new issuer holdings or history."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          history_snapshot="$(mktemp)"
          remote="$(mktemp)"
          remote_history="$(mktemp)"
          trap 'rm -f "$snapshot" "$history_snapshot" "$remote" "$remote_history"' EXIT
          cp "$file" "$snapshot"
          cp "$history" "$history_snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            if git show "origin/main:$file" > "$remote" 2>/dev/null; then
              if node -e '
                const fs=require("node:fs");
                const incoming=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                const published=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
                if((published.asOf||"")>(incoming.asOf||""))process.exit(0);
                process.exit(1);
              ' "$snapshot" "$remote"; then
                echo "A more recent Canary holdings report is already published."
                exit 0
              fi
            fi
            git show "origin/main:$history" > "$remote_history" 2>/dev/null || echo '{}' > "$remote_history"
            git reset --hard origin/main
            cp "$snapshot" "$file"
            # Merge histories on retry to preserve any observation published by another workflow.
            node - "$remote_history" "$history_snapshot" "$history" <<'NODE'
          const fs=require('node:fs');
          const remote=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const local=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const merged=new Map();
          for(const row of [...(remote.points||[]),...(local.points||[])]){
            if(/^\d{4}-\d{2}-\d{2}$/.test(row.date||'')&&
              Number.isFinite(Number(row.injHeld))&&Number(row.injHeld)>0)
              merged.set(row.date,{date:row.date,injHeld:Number(row.injHeld)});
          }
          const points=[...merged.values()].sort((a,b)=>a.date.localeCompare(b.date));
          const result={schemaVersion:1,ticker:'INJC',source:'https://canaryetfs.com/injc/',
            updatedAt:points.at(-1)?.date||null,points};
          fs.writeFileSync(process.argv[4],JSON.stringify(result,null,2)+'\n');
          NODE
            git add "$file" "$history"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(injc): refresh official INJ holdings and dated quantity chart"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Could not publish INJC holdings after retries"
          exit 1
